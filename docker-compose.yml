services:
  # Local PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: master_backend_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: master_backend
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Backend Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: master_backend
    restart: always
    ports:
      - "${PORT:-5050}:${PORT:-5050}"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Falls back to local database container if DATABASE_URL is not set in .env
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@db:5432/master_backend?schema=public}

volumes:
  postgres_data:
